
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>AR Сатурн</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 5%;
      width: 90%;
      padding: 12px 0;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      text-align: center;
      border-radius: 10px;
      z-index: 9999;
      font-size: 16px;
    }
  </style>

  <script>
    AFRAME.registerComponent("marker-check", {
      init: function () {
        const status = document.getElementById("status");

        this.el.addEventListener("markerFound", function () {
          status.innerText = "Сатурн обнаружен!";
          status.style.background = "green";
        });

        this.el.addEventListener("markerLost", function () {
          status.innerText = "Наведите камеру на маркер Сатурна";
          status.style.background = "rgba(0,0,0,0.7)";
        });
      }
    });
  </script>
</head>

<body>

  <div id="status">
    Наведите камеру на маркер Сатурна
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker
      type="pattern"
      url="./pattern-saturn.jpg.patt"
      emitevents="true"
      smooth="true"
      marker-check>

      <a-entity
        position="0 0.6 0"
        animation="property: rotation;
                   to: 0 360 0;
                   dur: 12000;
                   loop: true;
                   easing: linear">

        <!-- Планета Сатурн -->
        <a-sphere
          radius="0.3"
          color="#D9AD72"
          segments-width="32"
          segments-height="24">
        </a-sphere>

        <!-- Первое кольцо -->
        <a-torus
          radius="0.48"
          radius-tubular="0.035"
          rotation="-70 0 0"
          color="#B5B9C3">
        </a-torus>

        <!-- Второе кольцо -->
        <a-torus
          radius="0.57"
          radius-tubular="0.025"
          rotation="-70 0 0"
          color="#D8C9A8">
        </a-torus>

        <!-- Третье кольцо -->
        <a-torus
          radius="0.65"
          radius-tubular="0.015"
          rotation="-70 0 0"
          color="#9C927F">
        </a-torus>

      </a-entity>

      <!-- Название планеты -->
      <a-text
        value="SATURN"
        position="0 1.35 0"
        align="center"
        color="#FFFFFF"
        width="3.5"
        side="double">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
